<!-- This is HTML5 -->
<!Doctype html>>
<!-- This is a webpage -->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A fully structured HTML page" />
    
    <title>My Complete Website</title>
</head>

<body> 
    <header>
        <h1>Welcome to my webpage</h1>
        <p>This page contains various HTML elements we have learned</p>
    </header>
    <section>
        <h2>Topics Covered</h2>
        <ul>
            <li>HTML Structure</li>
            <li>Meta Tags</li>
            <li>Lists</li>
            <li>Tables</li>
            <li>Forms</li>
        </ul>
    </section>
    <section>
        <h2>Student Scores</h2>
            <table border="1">
                <tr>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>Alice</td>
                    <td>92</td>
                </tr>
            </table>
        
    </section>
    
    <section>
        <h2>Sign up form</h2>
        <form>
            <label for="name">Name: </label>
            <input type="text" id="name" required />
            <br />
            <label for="email">Email: </label>
            <input type="email" id="email" required />
            <br />
            <label for="password">Password: </label>
            <input type="password" id="password" required />
            <br />
            <select id="country">
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
            </select>
            <br />
            <button type="submit">Sign up</button>


        </form>
    </section>
</body>


</html>
